name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build-time placeholders only. No real credentials live in CI, and these
      # values are never used against a database because the job only compiles.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: pk.placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify TypeScript lint coverage
        run: node src/scripts/check-lint-coverage.mjs

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: migrations and database permission/workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: eprop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local-ci-only
      PGDATABASE: eprop_test
    steps:
      - uses: actions/checkout@v5
      - name: Bootstrap Supabase platform fixtures
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - name: Apply all migrations
        run: |
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify permissions and workflows
        run: |
          for suite in supabase/tests/*.sql; do
            if [ "$suite" != "supabase/tests/bootstrap.sql" ]; then
              psql -v ON_ERROR_STOP=1 -f "$suite"
            fi
          done
